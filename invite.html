<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение на свидание 💌</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Стили только для страницы приглашения */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .invite-wrapper {
      position: relative;
      z-index: 10;
      max-width: 600px;
      width: 100%;
    }
    .invite-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      padding: 50px 40px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(214, 51, 108, 0.3);
      border: 4px double var(--accent);
      position: relative;
      animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .invite-type {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(214, 51, 108, 0.4);
    }
    .invite-title {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 15px;
      font-family: 'Georgia', serif;
      line-height: 1.2;
    }
    .invite-date {
      font-size: 1.3rem;
      color: var(--text-soft);
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 2px dashed rgba(255, 107, 163, 0.4);
      font-weight: 600;
    }
    .invite-notes {
      font-size: 1.1rem;
      color: var(--text-main);
      font-style: italic;
      background: rgba(255, 107, 163, 0.1);
      padding: 15px 20px;
      border-radius: 15px;
      margin-bottom: 30px;
      text-align: left;
    }
    .invite-notes span {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: normal;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .invite-footer {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 30px;
    }
    .invite-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>

  <div class="invite-wrapper">
    <div class="invite-card">
      <div class="invite-type" id="invType">Свидание</div>
      <h1 class="invite-title" id="invTitle">Название</h1>
      <div class="invite-date" id="invDate">Дата</div>
      
      <div class="invite-notes" id="invNotesBox" style="display: none;">
        <span>📝 Пожелания / заметки:</span>
        <div id="invNotes"></div>
      </div>

      <div class="invite-footer">
        С любовью, для тебя 💕
      </div>

      <div class="invite-actions">
        <button class="btn" onclick="window.location.href='index.html'">⬅️ На главную</button>
        <button class="btn" onclick="window.print()" style="background: linear-gradient(135deg, #a78bfa, #7c3aed);">🖨️ Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // Читаем данные из ссылки
    const params = new URLSearchParams(window.location.search);
    
    // Если данных нет (зашли просто так), показываем заглушку
    if (!params.has('title')) {
      document.getElementById('invTitle').textContent = 'Свидание не выбрано';
      document.getElementById('invDate').textContent = 'Вернись на главную и заполни форму!';
    } else {
      document.getElementById('invType').textContent = params.get('type') || 'Мероприятие';
      document.getElementById('invTitle').textContent = params.get('title');
      
      // Красиво форматируем дату
      const rawDate = params.get('date');
      if (rawDate) {
        const d = new Date(rawDate);
        const dateStr = d.toLocaleDateString('ru-RU', { 
          day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' 
        });
        document.getElementById('invDate').textContent = '📅 ' + dateStr;
      }

      const notes = params.get('notes');
      if (notes) {
        document.getElementById('invNotesBox').style.display = 'block';
        document.getElementById('invNotes').textContent = notes;
      }
    }

    // Добавляем плавающие сердечки
    const heartsContainer = document.getElementById('heartsBg');
    const heartSymbols = ['💗', '💕', '💖', '🌸', '💞', '🌷'];
    for (let i = 0; i < 15; i++) {
      const span = document.createElement('span');
      span.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      span.style.left = Math.random() * 100 + '%';
      span.style.fontSize = (16 + Math.random() * 20) + 'px';
      span.style.animationDuration = (10 + Math.random() * 10) + 's';
      span.style.animationDelay = (Math.random() * 10) + 's';
      heartsContainer.appendChild(span);
    }
  </script>
</body>
</html>
